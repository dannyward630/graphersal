# cargo-about configuration: generates THIRD-PARTY-LICENSES for the `graphersal-cli` binary.
#   cargo about generate --config about.toml --manifest-path crates/graphersal-cli/Cargo.toml about.hbs > THIRD-PARTY-LICENSES.html
# The accepted list mirrors the licence allow list of deny.toml.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true

# model2vec-rs (the `model2vec` feature, on in the CLI) declares its licence only through
# `license-file = "LICENSE"`; that file is the MIT licence text. The checksum pins it.
[model2vec-rs.clarify]
license = "MIT"

[[model2vec-rs.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "6869ad291a9df9866448579b7157bf337373a21ced5b4b315e68b2924aff2ab9"
