name: DCO

# Every commit of a pull request must carry a `Signed-off-by:` line that matches its author
# (Developer Certificate of Origin, see CONTRIBUTING.md and the DCO file).

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check sign-off of every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if ! git log -1 --format='%B' "$sha" | grep -qxF "Signed-off-by: $author"; then
              echo "::error::commit $sha is not signed off by its author ($author); run: git rebase --signoff $BASE"
              status=1
            fi
          done
          exit $status
