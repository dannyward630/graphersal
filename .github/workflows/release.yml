name: Release

# Publishes the Python package `graphersal` to PyPI: the five-platform wheels and the sdist built
# by python.yml (which also runs the binding's tests), uploaded through PyPI Trusted Publishing
# (OIDC: no token in this repository; PyPI trusts this file, `release.yml`, in the environment
# `pypi`). The crates go to crates.io by hand (`cargo publish`, graphersal first).
#
# Manual only, on a release tag:  gh workflow run Release --ref v0.1.0
# The tag must equal the workspace version (`version` in the root Cargo.toml).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The ref is a tag v<version> of the workspace version
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::Start the release on a tag: gh workflow run Release --ref v<version>"; exit 1 ;;
          esac
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [ "$tag" != "$version" ]; then
            echo "::error::The tag v$tag does not match the workspace version $version"
            exit 1
          fi
          echo "Releasing $version"

  build:
    needs: check
    uses: ./.github/workflows/python.yml
    with:
      wheels: true

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/graphersal/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true
      - name: Six files (five wheels and the sdist)
        run: |
          ls -l dist
          test "$(find dist -type f | wc -l)" -eq 6
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
