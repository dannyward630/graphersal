name: Semver check

# Manual only (workflow_dispatch, a project decision like CI): cargo-semver-checks compares the public API with the
# release published on crates.io, so it is useful from 0.1.0 on; run it before every release.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: graphersal
