[book]
authors = ["Aleksandr Dederer"]
language = "en"
multilingual = false
src = "src"
title = "The Graphersal Documentation"

[output.html]
git-repository-url = "https://github.com/graphersal/graphersal"
edit-url-template = "https://github.com/graphersal/graphersal/edit/main/book/{path}"
# "Run in the playground" under the code blocks marked ```rhai,graph=<sample> (see the script)
additional-js = ["playground-links.js"]
additional-css = ["playground-links.css"]

# The sidebar shows the parts and their chapters; the pages below a chapter (the steps of the
# step reference, the Store's pages) are folded until that chapter is open or its arrow is clicked.
[output.html.fold]
enable = true
level = 0
