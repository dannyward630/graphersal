[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "graphersal"
description = "In-memory graph database and traversal engine, queried with Gremlin (Rust engine, no server)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["graph", "gremlin", "tinkerpop", "graph-database", "traversal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
]
dynamic = ["version"]
authors = [{ name = "Aleksandr Dederer", email = "aleks@graphersal.dev" }]

[project.urls]
Homepage = "https://graphersal.dev"
Documentation = "https://graphersal.dev"
Repository = "https://github.com/graphersal/graphersal"
Playground = "https://play.graphersal.dev"

[tool.maturin]
features = ["extension-module"]
module-name = "graphersal"
